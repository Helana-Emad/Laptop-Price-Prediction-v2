<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaptopPrice | Predict Price</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <i class="fas fa-laptop"></i>
            Laptop<span>Price</span>
        </a>

        <ul class="nav-links-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="predict.html" class="active">Predict Price</a></li>
            <li><a href="analytics.html">Laptop Guide</a></li>
            <li><a href="about.html">About Project</a></li>
        </ul>

        <div class="header-tag">
            <span class="status-dot"></span>
            AI Prediction System
        </div>
    </header>

    <main class="single-page-container">
        <section class="prediction-card">
            <div class="form-heading">
                <div>
                    <span class="section-label">LAPTOP ANALYZER</span>
                    <h2>Predict Your Price</h2>
                    <p>Enter the laptop specifications below.</p>
                </div>
                <div class="form-icon">
                    <i class="fas fa-laptop-code"></i>
                </div>
            </div>

            <form id="prediction-form">
                <div class="form-group full-width">
                    <label for="brand">Brand</label>
                    <select id="brand" required>
                        <option value="">Select brand</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="">Select status</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cpu">CPU</label>
                    <select id="cpu" required>
                        <option value="">Select CPU</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gpu">GPU</label>
                    <select id="gpu" required>
                        <option value="">Select GPU</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ram">RAM</label>
                    <select id="ram" required>
                        <option value="">Select RAM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="storage">Storage Capacity</label>
                    <select id="storage" required>
                        <option value="">Select storage</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="storage_type">Storage Type</label>
                    <select id="storage_type" required>
                        <option value="">Select type</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="screen">Screen Size</label>
                    <select id="screen" required>
                        <option value="">Select screen size</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="touch">Touch Screen</label>
                    <select id="touch" required>
                        <option value="">Select an option</option>
                    </select>
                </div>

                <button type="submit" class="full-width predict-button">
                    <span>Predict Laptop Price</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div id="result" style="display: none;" aria-live="polite"></div>

            <p class="form-note">
                <i class="fas fa-info-circle"></i>
                The result is an estimate generated by the ML model.
            </p>
        </section>
    </main>

    <footer>
        <p>Powered by Machine Learning <span>•</span> LaptopPrice Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
